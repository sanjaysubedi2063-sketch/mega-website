<html lang="en">

<head>

    <meta name="theme-color" content="#5856d6">
    <title>Word to PDF Converter – Fast & Secure (Client‑Side)</title>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #5856d6;
            --accent-hover: #434190;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* -----------------------------------------------------------------
           Layout
        ----------------------------------------------------------------- */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-main);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-group {
            margin-bottom: 20px;
        }

        .nav-group-title {
            font-size: .8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .nav-btn {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 10px 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: all .2s ease;
            font-size: .9rem;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--bg-secondary);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-panel {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .tool-container {
            flex: 3;
            padding: 30px;
            overflow-y: auto;
        }

        .tool-section {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .dropzone {
            border: 2px dashed var(--border);
            padding: 40px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(15, 23, 42, .4);
            margin-bottom: 20px;
            transition: border-color .3s ease;
        }

        .dropzone:hover {
            border-color: var(--accent);
        }

        .action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background .2s;
        }

        .action-btn:hover {
            background: var(--accent-hover);
        }

        .action-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        .preview-panel {
            flex: 2;
            background: rgba(30, 41, 59, .5);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-header {
            padding: 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: .95rem;
        }

        .live-logs {
            padding: 15px;
            font-family: monospace;
            font-size: .85rem;
            color: var(--success);
            max-height: 120px;
            overflow-y: auto;
            background: #090d16;
            border-bottom: 1px solid var(--border);
        }

        .visual-preview-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Document preview styling (inside the live preview) */
        #document-preview-render {
            background: #ffffff;
            color: #1e293b;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, .3);
            font-size: 14px;
            line-height: 1.6;
        }

        #document-preview-render p {
            margin-bottom: 12px;
        }

        #document-preview-render h1,
        #document-preview-render h2,
        #document-preview-render h3 {
            margin-top: 15px;
            margin-bottom: 10px;
            color: #0f172a;
        }

        #document-preview-render table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        #document-preview-render th,
        #document-preview-render td {
            border: 1px solid #cbd5e1;
            padding: 8px;
            text-align: left;
        }

        /* Hidden staging container (used only by html2pdf) */
        .pdf-staging {
            display: none;
            position: absolute;
            left: -9999px;
            width: 750px;
            background: #ffffff;
            color: #1e293b;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23
