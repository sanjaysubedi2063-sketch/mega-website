<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="High-fidelity Word to PDF Converter preserving document structure natively.">
    <meta name="theme-color" content="#5856d6">
    <title>Word to PDF Converter - Native Structure Engine</title>
    
    <!-- Dependencies: Mammoth for parsing, pdfmake for native vector PDF compilation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #5856d6;
            --accent-hover: #434190;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--text-main); padding-bottom: 10px; border-bottom: 2px solid var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .nav-group { margin-bottom: 20px; }
        .nav-group-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        .nav-btn { width: 100%; background: transparent; border: 1px solid transparent; color: var(--text-main); padding: 10px 12px; text-align: left; border-radius: 6px; cursor: pointer; margin-bottom: 5px; transition: all 0.2s ease; font-size: 0.9rem; display: flex; align-items: center; text-decoration: none; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--accent); border-color: var(--accent); }
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background-color: var(--bg-secondary); padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .main-panel { flex: 1; display: flex; overflow: hidden; }
        .tool-container { flex: 3; padding: 30px; overflow-y: auto; }
        .tool-section { background: var(--bg-secondary); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }
        .dropzone { border: 2px dashed var(--border); padding: 40px 20px; text-align: center; border-radius: 8px; cursor: pointer; background: rgba(15, 23, 42, 0.4); margin-bottom: 20px; transition: border-color 0.3s ease; }
        .dropzone:hover { border-color: var(--accent); }
        .action-btn { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .action-btn:hover { background-color: var(--accent-hover); }
        .action-btn:disabled { background-color: var(--border); cursor: not-allowed; opacity: 0.7; }
        .preview-panel { flex: 2; background-color: rgba(30, 41, 59, 0.5); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .preview-header { padding: 15px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
        .live-logs { padding: 15px; font-family: monospace; font-size: 0.85rem; color: var(--success); max-height: 120px; overflow-y: auto; background: #090d16; border-bottom: 1px solid var(--border); }
        .visual-preview-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        
        #document-preview-render {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 750px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
        }
        #document-preview-render p { margin-bottom: 12px; }
        #document-preview-render h1 { font-size: 22px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>HyperEngine v5.0</h2>
        <div class="nav-group">
            <div class="nav-group-title">Navigation</div>
            <a href="index.html" class="nav-btn">← Back to Dashboard</a>
            <a href="word-to-pdf.html" class="nav-btn active">Word to PDF</a>
        </div>
    </div>
    <div class="workspace">
        <div class="header">
            <h1>Word to PDF Converter</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Native Vector Rendering</span>
        </div>
        <div class="main-panel">
            <div class="tool-container">
                <div class="tool-section">
                    <div class="dropzone" onclick="document.getElementById('word-pdf-input').click()">
                        <p>Upload Microsoft Word document (.docx)</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Click to browse files</p>
                        <input type="file" id="word-pdf-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;" onchange="handleFileSelect(this)">
                    </div>
                    <button id="convert-btn" class="action-btn" onclick="executeWordToPdf()" disabled>Convert & Download PDF Document</button>
                </div>
            </div>
            <div class="preview-panel">
                <div class="preview-header">
                    <span>Parsed Content Preview</span>
                    <span id="file-size-badge" style="font-size: 0.75rem; background: var(--accent); padding: 2px 8px; border-radius: 4px; display: none;">Size: 0 KB</span>
                </div>
                <div class="live-logs" id="log-console">&gt; Tool initialized. Ready for file upload.</div>
                <div class="visual-preview-box" id="preview-display">
                    <span style="color: var(--text-muted); font-size: 0.9rem; margin-top: 40px;">No document loaded yet.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stagedFileName = "";
        let parsedDocumentContent = [];
        let generatedPdfBlob = null;

        function logAction(msg) {
            const consoleEl = document.getElementById('log-console');
            if (consoleEl) { consoleEl.innerHTML += `<br>&gt; ${msg}`; consoleEl.scrollTop = consoleEl.scrollHeight; }
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        async function handleFileSelect(inputElement) {
            const file = inputElement.files[0];
            if(!file) return;
            stagedFileName = file.name;
            logAction(`Loaded Word file: ${file.name}`);

            const reader = new FileReader();
            reader.onload = async function(event) {
                const arrayBuffer = event.target.result;

                try {
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    const textLines = result.value.split('\n').filter(line => line.trim() !== '');

                    parsedDocumentContent = textLines.map(line => {
                        if(line.length < 50 && (line.toLowerCase().includes('chapter') || line.toLowerCase().includes('project') || line.startsWith('1.') || line.startsWith('2.') || line.startsWith('3.'))) {
                            return { text: line, fontSize: 16, bold: true, margin: [0, 15, 0, 5], color: '#0f172a' };
                        }
                        return { text: line, fontSize: 11, margin: [0, 0, 0, 8], color: '#334155' };
                    });

                    // Render preview
                    const previewHtml = textLines.map(l => `<p>${l}</p>`).join('');
                    document.getElementById('preview-display').innerHTML = `
                        <div id="document-preview-render">
                            <h1>${file.name}</h1>
                            ${previewHtml}
                        </div>
                    `;

                    // Compile PDF definition securely to calculate exact size upfront
                    const docDefinition = {
                        content: [
                            { text: file.name, fontSize: 20, bold: true, margin: [0, 0, 0, 15] },
                            ...parsedDocumentContent
                        ],
                        defaultStyle: { font: 'Roboto' },
                        pageMargins: [40, 40, 40, 40]
                    };

                    pdfMake.createPdf(docDefinition).getBlob((blob) => {
                        generatedPdfBlob = blob;
                        const formattedSize = formatBytes(blob.size);
                        const sizeBadge = document.getElementById('file-size-badge');
                        sizeBadge.innerText = `Size: ${formattedSize}`;
                        sizeBadge.style.display = 'inline-block';
                        logAction(`Success: Native vector PDF compiled. File size: ${formattedSize}`);
                    });

                    isFileLoaded = true;
                    document.getElementById('convert-btn').removeAttribute('disabled');
                } catch (err) {
                    logAction("Error parsing document: " + err.message);
                } finally {
                    inputElement.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function executeWordToPdf() {
            if(!isFileLoaded || !generatedPdfBlob) { alert("Please wait for file compilation to complete."); return; }
            logAction("Triggering secure file download...");

            const downloadName = stagedFileName.replace(/\.[^/.]+$/, "") + ".pdf";
            
            const docDefinition = {
                content: [
                    { text: stagedFileName, fontSize: 20, bold: true, margin: [0, 0, 0, 15] },
                    ...parsedDocumentContent
                ],
                defaultStyle: { font: 'Roboto' },
                pageMargins: [40, 40, 40, 40]
            };

            pdfMake.createPdf(docDefinition).download(downloadName);
            logAction(`Success: Download started for "${downloadName}".`);
        }
    </script>
</body>
</html>
