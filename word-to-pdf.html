<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Convert Microsoft Word documents into pixel-perfect PDF files directly in your web browser securely.">
    <meta name="theme-color" content="#5856d6">
    <title>Word to PDF Converter Online - Fast & Secure Document Conversion</title>
    
    <!-- docx-preview library for faithful Word rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.20/dist/docx-preview.min.js"></script>
    <!-- html2pdf.js for exporting exact visual structure to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #5856d6;
            --accent-hover: #434190;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--text-main); padding-bottom: 10px; border-bottom: 2px solid var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .nav-group { margin-bottom: 20px; }
        .nav-group-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        .nav-btn { width: 100%; background: transparent; border: 1px solid transparent; color: var(--text-main); padding: 10px 12px; text-align: left; border-radius: 6px; cursor: pointer; margin-bottom: 5px; transition: all 0.2s ease; font-size: 0.9rem; display: flex; align-items: center; text-decoration: none; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--accent); border-color: var(--accent); }
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background-color: var(--bg-secondary); padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .main-panel { flex: 1; display: flex; overflow: hidden; }
        .tool-container { flex: 3; padding: 30px; overflow-y: auto; }
        .tool-section { background: var(--bg-secondary); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }
        .dropzone { border: 2px dashed var(--border); padding: 40px 20px; text-align: center; border-radius: 8px; cursor: pointer; background: rgba(15, 23, 42, 0.4); margin-bottom: 20px; transition: border-color 0.3s ease; }
        .dropzone:hover { border-color: var(--accent); }
        .action-btn { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .action-btn:hover { background-color: var(--accent-hover); }
        .preview-panel { flex: 2; background-color: rgba(30, 41, 59, 0.5); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .preview-header { padding: 15px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 0.95rem; }
        .live-logs { padding: 15px; font-family: monospace; font-size: 0.85rem; color: var(--success); max-height: 120px; overflow-y: auto; background: #090d16; border-bottom: 1px solid var(--border); }
        .visual-preview-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        
        #document-preview-render {
            background: #ffffff;
            color: #000000;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>HyperEngine v5.0</h2>
        <div class="nav-group">
            <div class="nav-group-title">Navigation</div>
            <a href="index.html" class="nav-btn">← Back to Dashboard</a>
            <a href="word-to-pdf.html" class="nav-btn active">Word to PDF</a>
        </div>
    </div>
    <div class="workspace">
        <div class="header">
            <h1>Word to PDF Converter</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Client-Side Safe Execution</span>
        </div>
        <div class="main-panel">
            <div class="tool-container">
                <div class="tool-section">
                    <div class="dropzone" onclick="document.getElementById('word-pdf-input').click()">
                        <p>Upload Microsoft Word document (.docx)</p>
                        <input type="file" id="word-pdf-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;" onchange="handleFileSelect(this)">
                    </div>
                    <button class="action-btn" onclick="executeWordToPdf()">Convert & Download PDF Document</button>
                </div>
            </div>
            <div class="preview-panel">
                <div class="preview-header">Live Word Document View</div>
                <div class="live-logs" id="log-console">&gt; Word to PDF tool initialized. Upload a .docx file.</div>
                <div class="visual-preview-box" id="preview-display">
                    <span style="color: var(--text-muted); font-size: 0.9rem; margin-top: 40px;">No document loaded yet.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden staging container used for layout-accurate rendering during PDF compilation -->
    <div id="pdf-export-staging" style="display:none; position: absolute; left: -9999px; width: 800px; background: white; color: black; padding: 40px;"></div>

    <script>
        let stagedArrayBuffer = null;
        let stagedFileName = "";

        function logAction(msg) {
            const consoleEl = document.getElementById('log-console');
            if (consoleEl) { consoleEl.innerHTML += `<br>&gt; ${msg}`; consoleEl.scrollTop = consoleEl.scrollHeight; }
        }

        async function handleFileSelect(inputElement) {
            const file = inputElement.files[0];
            if(!file) return;
            stagedFileName = file.name;
            logAction(`Loaded Word file: ${file.name}`);

            const reader = new FileReader();
            reader.onload = async function(event) {
                stagedArrayBuffer = event.target.result;

                // Render document layout visually in the preview panel using docx-preview
                const previewContainer = document.createElement('div');
                previewContainer.id = "document-preview-render";
                
                const exportContainer = document.createElement('div');
                exportContainer.style.background = "#ffffff";
                exportContainer.style.color = "#000000";
                exportContainer.style.padding = "20px";
                exportContainer.style.width = "750px";

                document.getElementById('preview-display').innerHTML = "";
                document.getElementById('preview-display').appendChild(previewContainer);

                document.getElementById('pdf-export-staging').innerHTML = "";
                document.getElementById('pdf-export-staging').appendChild(exportContainer);

                try {
                    await docx.renderAsync(stagedArrayBuffer, previewContainer);
                    await docx.renderAsync(stagedArrayBuffer, exportContainer);
                    logAction("Success: Word layout rendered with exact paragraph structure and spacing.");
                } catch (err) {
                    logAction("Error rendering document layout: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function executeWordToPdf() {
            if(!stagedArrayBuffer) { alert("Please upload a Word document file first."); return; }
            logAction("Compiling exact layout structure into PDF document...");

            const element = document.getElementById('pdf-export-staging');
            const opt = {
                margin:       10,
                filename:     stagedFileName.replace(/\.[^/.]+$/, "") + ".pdf",
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                logAction("Success: Pixel-perfect PDF generated and downloaded.");
            }).catch(err => {
                logAction("PDF generation error: " + err);
            });
        }
    </script>
</body>
</html>
