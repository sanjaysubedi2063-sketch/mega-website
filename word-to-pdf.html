<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Convert Microsoft Word documents (DOC, DOCX) into clean, professional PDF files directly in your web browser securely.">
    <meta name="theme-color" content="#5856d6">
    <title>Word to PDF Converter Online - Fast & Secure Document Conversion</title>
    
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Mammoth.js Library for parsing .docx files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #5856d6;
            --accent-hover: #434190;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--text-main); padding-bottom: 10px; border-bottom: 2px solid var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .nav-group { margin-bottom: 20px; }
        .nav-group-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        .nav-btn { width: 100%; background: transparent; border: 1px solid transparent; color: var(--text-main); padding: 10px 12px; text-align: left; border-radius: 6px; cursor: pointer; margin-bottom: 5px; transition: all 0.2s ease; font-size: 0.9rem; display: flex; align-items: center; text-decoration: none; }
        .nav-btn:hover, .nav-btn.active { background-color: var(--accent); border-color: var(--accent); }
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background-color: var(--bg-secondary); padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .main-panel { flex: 1; display: flex; overflow: hidden; }
        .tool-container { flex: 3; padding: 30px; overflow-y: auto; }
        .tool-section { background: var(--bg-secondary); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }
        .dropzone { border: 2px dashed var(--border); padding: 40px 20px; text-align: center; border-radius: 8px; cursor: pointer; background: rgba(15, 23, 42, 0.4); margin-bottom: 20px; transition: border-color 0.3s ease; }
        .dropzone:hover { border-color: var(--accent); }
        .action-btn { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .action-btn:hover { background-color: var(--accent-hover); }
        .preview-panel { flex: 2; background-color: rgba(30, 41, 59, 0.5); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .preview-header { padding: 15px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 0.95rem; }
        .live-logs { padding: 15px; font-family: monospace; font-size: 0.85rem; color: var(--success); max-height: 150px; overflow-y: auto; background: #090d16; border-bottom: 1px solid var(--border); }
        .visual-preview-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>HyperEngine v5.0</h2>
        <div class="nav-group">
            <div class="nav-group-title">Navigation</div>
            <a href="index.html" class="nav-btn">← Back to Dashboard</a>
            <a href="word-to-pdf.html" class="nav-btn active">Word to PDF</a>
        </div>
    </div>
    <div class="workspace">
        <div class="header">
            <h1>Word to PDF Converter</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Client-Side Safe Execution</span>
        </div>
        <div class="main-panel">
            <div class="tool-container">
                <div class="tool-section">
                    <div class="dropzone" onclick="document.getElementById('word-pdf-input').click()">
                        <p>Upload Microsoft Word document (.docx)</p>
                        <input type="file" id="word-pdf-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;" onchange="handleFileSelect(this)">
                    </div>
                    <button class="action-btn" onclick="executeWordToPdf()">Convert & Download PDF Document</button>
                </div>
            </div>
            <div class="preview-panel">
                <div class="preview-header">Live Step & Render Preview</div>
                <div class="live-logs" id="log-console">&gt; Word to PDF tool initialized. Upload Word document.</div>
                <div class="visual-preview-box" id="preview-display">
                    <span style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">No document text parsed yet.</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        let stagedWordFile = null;
        let extractedWordText = "";

        function logAction(msg) {
            const consoleEl = document.getElementById('log-console');
            if (consoleEl) { consoleEl.innerHTML += `<br>&gt; ${msg}`; consoleEl.scrollTop = consoleEl.scrollHeight; }
        }

        function handleFileSelect(inputElement) {
            const file = inputElement.files[0];
            if(!file) return;
            stagedWordFile = file;
            logAction(`Loaded Word file: ${file.name}`);

            const previewBox = document.getElementById('preview-display');
            previewBox.innerHTML = `<div style="padding: 15px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; width: 100%;">
                <p style="color: var(--text-main); font-weight: bold; margin-bottom: 5px;">${file.name}</p>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Size: ${(file.size / 1024).toFixed(2)} KB</p>
            </div>`;

            // Parse document text instantly using Mammoth.js
            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(result => {
                        extractedWordText = result.value;
                        logAction("Success: Document text extracted from paragraphs.");
                        previewBox.innerHTML += `<div style="margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px;"><strong>Parsed Preview:</strong><br>${escapeHtml(extractedWordText.substring(0, 300))}...</div>`;
                    })
                    .catch(err => {
                        logAction("Error parsing document: " + err.message);
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function executeWordToPdf() {
            if(!stagedWordFile) { alert("Please upload a Word document file first."); return; }
            logAction("Generating PDF file with extracted document text...");

            const { jsPDF } = window.jspdf;
            const pdfDoc = new jsPDF();

            pdfDoc.setFont("helvetica", "bold");
            pdfDoc.setFontSize(16);
            pdfDoc.text(`Document: ${stagedWordFile.name}`, 20, 20);

            pdfDoc.setFont("helvetica", "normal");
            pdfDoc.setFontSize(10);
            
            // Split extracted text into lines that fit nicely inside standard page margins (approx 170mm wide)
            const splitText = pdfDoc.splitTextToSize(extractedWordText || "No content found.", 170);
            
            let cursorY = 30;
            const pageHeight = pdfDoc.internal.pageSize.getHeight();

            // Loop through lines and handle multi-page pagination automatically
            for (let i = 0; i < splitText.length; i++) {
                if (cursorY > pageHeight - 20) {
                    pdfDoc.addPage();
                    cursorY = 20;
                }
                pdfDoc.text(splitText[i], 20, cursorY);
                cursorY += 7; // line spacing
            }

            pdfDoc.save("Converted_Document.pdf");
            logAction("Success: Word content successfully exported to PDF and downloaded.");
        }
    </script>
</body>
</html>
