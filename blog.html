<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Sanjay Subedi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #5856d6; margin-bottom: 30px; text-align: center; }
        .post-card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; }
        .post-title { font-size: 1.5rem; color: #fff; margin-bottom: 10px; }
        .post-category { display: inline-block; background: #334155; padding: 2px 10px; border-radius: 4px; font-size: 0.8rem; margin-bottom: 15px; color: #94a3b8; }
        /* IMPORTANT: This ensures Quill formatting renders correctly */
        .post-content { color: #e2e8f0; }
        .post-content p { margin-bottom: 15px; }
        .post-content strong { color: #fff; }
        .post-content ol, .post-content ul { margin-left: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Latest Posts</h1>
        <div id="posts-container">Loading posts...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://zsocpkuidcwkjhzzjuni.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb2Nwa3VpZGN3a2poenpqdW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjIxODAsImV4cCI6MjA5OTg5ODE4MH0.46k4OxJi5hQdqD0NBTcxrtArsD9XfB4jyYOWgh2yBo0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPosts() {
            const { data, error } = await supabaseClient
                .from('blogs')
                .select('*')
                .eq('status', 'published')
                .order('created_at', { ascending: false });

            const container = document.getElementById('posts-container');
            
            if (error || !data.length) {
                container.innerHTML = "<p>No published posts found.</p>";
                return;
            }

            container.innerHTML = data.map(post => `
                <div class="post-card">
                    <h2 class="post-title">${post.title}</h2>
                    <span class="post-category">${post.category || 'General'}</span>
                    <div class="post-content">
                        ${post.content}
                    </div>
                </div>
            `).join('');
        }

        fetchPosts();
    </script>
</body>
</html>
