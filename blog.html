<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay's Blog</title>
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .post { background: #1e293b; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Latest Posts</h1>
    <div id="blog-container">Loading...</div>

    <script>
        // Configuration
        const SUPABASE_URL = 'https://zsocpkuidcwkjhzzjuni.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb2Nwa3VpZGN3a2poenpqdW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjIxODAsImV4cCI6MjA5OTg5ODE4MH0.46k4OxJi5hQdqD0NBTcxrtArsD9XfB4jyYOWgh2yBo0';

        // Initialize with a different variable name to avoid conflict
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchPosts() {
            const container = document.getElementById('blog-container');
            try {
                // Use sbClient here
                const { data, error } = await sbClient
                    .from('posts')
                    .select('*');

                if (error) throw error;

                container.innerHTML = ''; 

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>No posts found.</p>';
                    return;
                }

                data.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post';
                    postDiv.innerHTML = `<h3>${post.title}</h3><p>${post.content}</p>`;
                    container.appendChild(postDiv);
                });
            } catch (err) {
                console.error('Error:', err);
                container.innerText = 'Failed to load posts. Check console.';
            }
        }

        fetchPosts();
    </script>
</body>
</html>
