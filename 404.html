<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Play a Game!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background-color: #0f172a; 
            color: white; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden; 
        }
        .header-section {
            margin-top: 20px;
        }
        h1 { 
            color: #5856d6; 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
        }
        p { 
            color: #94a3b8; 
            font-size: 1.1rem;
            margin-bottom: 15px; 
        }
        .score { 
            font-size: 1.5rem; 
            color: #10b981; 
            font-weight: bold; 
        }
        #game-box { 
            position: relative; 
            width: 100%; 
            height: 60vh; 
            border: 2px dashed #334155;
            border-radius: 12px;
            margin: 20px 0;
            overflow: hidden;
            background-color: #1e293b;
            transition: background-color 0.3s ease;
        }
        #target { 
            position: absolute; 
            padding: 12px 24px; 
            background: #5856d6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: left 0.15s ease-out, top 0.15s ease-out; 
        }
        .footer-section {
            margin-bottom: 20px;
        }
        .home-btn { 
            display: inline-block; 
            padding: 12px 24px; 
            background: #334155; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 500;
            transition: background 0.2s;
        }
        .home-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>Oops! 404 Error</h1>
        <p>You stumbled onto a broken link... But don't leave yet! Try to catch the button below:</p>
        <div class="score">Score: <span id="score-val">0</span></div>
    </div>

    <div id="game-box">
        <button id="target" onmouseover="moveButton()" onclick="hitButton()">Click Me!</button>
    </div>

    <div class="footer-section">
        <a href="https://sanjaysubedi.com.np/" class="home-btn">Go Back Home</a>
    </div>

    <script>
        let score = 0;
        const btn = document.getElementById('target');
        const box = document.getElementById('game-box');
        
        function moveButton() {
            // Calculate boundaries relative to the game container box
            const maxX = box.clientWidth - btn.clientWidth - 20;
            const maxY = box.clientHeight - btn.clientHeight - 20;
            
            // Generate random positions within boundaries
            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            // Fun Extra: Give the game board container a dynamic dark hue shift on movement
            const colors = ['#1e293b', '#0f172a', '#111827', '#1c1917', '#14532d', '#1e1b4b'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            box.style.backgroundColor = randomColor;
        }

        function hitButton() {
            score++;
            document.getElementById('score-val').innerText = score;
            alert("Wow, you actually caught it! Point added 🎉");
            moveButton();
        }
        
        // Setup initial position when the page finishes loading
        window.onload = () => {
            moveButton();
        };
    </script>
</body>
</html>
