<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - WordPress Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: white; font-family: system-ui, sans-serif; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        h1, h2 { color: #5856d6; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; }
        .publish-btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .edit-btn { background: #3b82f6; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome back, Sanjay!</h1>
        
        <h2 id="form-title">Create new post</h2>
        <form id="blog-form">
            <input type="hidden" id="edit-id">
            <input type="text" id="title" placeholder="Blog title" required>
            <input type="text" id="slug" placeholder="blog-url-slug" required>
            <input type="text" id="category" placeholder="Category (e.g. coding)">
            <select id="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
            </select>
            <textarea id="content" placeholder="Write your blog content here..." rows="5" required></textarea>
            <button type="submit" class="publish-btn" id="submit-btn">Publish post</button>
        </form>

        <h2>Manage posts</h2>
        <table id="posts-table">
            <thead><tr><th>Title</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="posts-body"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://zsocpkuidcwkjhzzjuni.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb2Nwa3VpZGN3a2poenpqdW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjIxODAsImV4cCI6MjA5OTg5ODE4MH0.46k4OxJi5hQdqD0NBTcxrtArsD9XfB4jyYOWgh2yBo0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Security: Redirect unauthorized users
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = "/admin/index.html";
        })();

        async function loadPosts() {
            const { data } = await supabaseClient.from('blogs').select('*');
            const body = document.getElementById('posts-body');
            body.innerHTML = (data || []).map(post => `
                <tr>
                    <td>${post.title}</td>
                    <td>${post.status || 'draft'}</td>
                    <td>
                        <button class="edit-btn" onclick="editPost('${post.id}', '${post.title}', '${post.slug}', '${post.category || ''}', '${post.status || 'draft'}', \`${post.content ? post.content.replace(/'/g, "\\'") : ''}\`)">Edit</button>
                        <button class="delete-btn" onclick="deletePost('${post.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function editPost(id, title, slug, category, status, content) {
            document.getElementById('edit-id').value = id;
            document.getElementById('title').value = title;
            document.getElementById('slug').value = slug;
            document.getElementById('category').value = category;
            document.getElementById('status').value = status;
            document.getElementById('content').value = content;
            document.getElementById('form-title').innerText = "Edit post";
            document.getElementById('submit-btn').innerText = "Update post";
            window.scrollTo(0, 0);
        }

        document.getElementById('blog-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const postData = {
                title: document.getElementById('title').value,
                slug: document.getElementById('slug').value,
                category: document.getElementById('category').value,
                status: document.getElementById('status').value,
                content: document.getElementById('content').value
            };

            if (id) {
                await supabaseClient.from('blogs').update(postData).eq('id', id);
                alert("Post Updated!");
            } else {
                await supabaseClient.from('blogs').insert([postData]);
                alert("Post Published!");
            }
            
            document.getElementById('blog-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = "Create new post";
            document.getElementById('submit-btn').innerText = "Publish post";
            loadPosts();
        });

        async function deletePost(id) {
            if (confirm('Are you sure?')) {
                await supabaseClient.from('blogs').delete().eq('id', id);
                loadPosts();
            }
        }

        loadPosts();
    </script>
</body>
</html>
