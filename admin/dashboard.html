<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: system-ui, sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #1e293b; padding: 30px; border-radius: 12px; }
        #editor { height: 200px; background: white; color: black; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: white; }
        .publish-btn { background: #10b981; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        <form id="blog-form">
            <input type="text" id="title" placeholder="Title" required>
            <input type="file" id="image-upload" accept="image/*">
            <div id="editor"></div>
            <button type="submit" class="publish-btn">Publish</button>
        </form>
    </div>

    <script>
        // Use a unique name for your client to avoid redeclaration errors
        const SUPABASE_URL = "https://zsocpkuidcwkjhzzjuni.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb2Nwa3VpZGN3a2poenpqdW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjIxODAsImV4cCI6MjA5OTg5ODE4MH0.46k4OxJi5hQdqD0NBTcxrtArsD9XfB4jyYOWgh2yBo0";
        
        // Ensure this is only declared once
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const quill = new Quill('#editor', { theme: 'snow' });

        document.getElementById('image-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                // Using the specific bucket name 'BLOG-IMAGES' as confirmed in your console
                const { data, error } = await supabaseClient.storage
                    .from('BLOG-IMAGES') 
                    .upload(`${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`, file, {
                        contentType: file.type,
                        upsert: true
                    });

                if (error) throw error;

                const { data: { publicUrl } } = supabaseClient.storage.from('BLOG-IMAGES').getPublicUrl(data.path);
                const range = quill.getSelection();
                quill.insertEmbed(range ? range.index : 0, 'image', publicUrl);
            } catch (err) {
                console.error("Upload failed:", err);
                alert("Upload failed: " + err.message);
            }
        });
    </script>
</body>
</html>
